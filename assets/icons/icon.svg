<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <g filter="url(#dropShadow)">
    <rect x="86" y="116" width="340" height="280" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4"/>
    <rect x="86" y="176" width="340" height="48" fill="#0f172a" opacity="0.8"/>
    <circle cx="256" cy="286" r="64" fill="url(#glowGrad)" />
    <!-- Dong / Currency Symbol -->
    <text x="256" y="306" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#ffffff" text-anchor="middle">₫</text>
    <circle cx="376" cy="286" r="14" fill="#38bdf8" />
  </g>
</svg>
